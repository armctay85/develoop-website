<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <linearGradient id="valuesGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#111111;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0a0a0a;stop-opacity:1" />
    </linearGradient>
  </defs>

  <rect width="800" height="600" fill="url(#valuesGrad)" />

  <!-- Core Values: Pillars/Foundation concept -->
  <g opacity="0.5">
    <!-- Foundation line -->
    <line x1="150" y1="450" x2="650" y2="450" stroke="#b8956e" stroke-width="3" />

    <!-- Four pillars -->
    <g stroke="#b8956e" fill="none">
      <!-- Pillar 1: Integrity -->
      <rect x="180" y="250" width="80" height="200" stroke-width="2" />
      <line x1="180" y1="280" x2="260" y2="280" stroke-width="0.5" opacity="0.5" />
      <line x1="180" y1="320" x2="260" y2="320" stroke-width="0.5" opacity="0.5" />
      <line x1="180" y1="360" x2="260" y2="360" stroke-width="0.5" opacity="0.5" />
      <line x1="180" y1="400" x2="260" y2="400" stroke-width="0.5" opacity="0.5" />

      <!-- Pillar 2: Excellence -->
      <rect x="300" y="200" width="80" height="250" stroke-width="2" />
      <line x1="300" y1="240" x2="380" y2="240" stroke-width="0.5" opacity="0.5" />
      <line x1="300" y1="290" x2="380" y2="290" stroke-width="0.5" opacity="0.5" />
      <line x1="300" y1="340" x2="380" y2="340" stroke-width="0.5" opacity="0.5" />
      <line x1="300" y1="390" x2="380" y2="390" stroke-width="0.5" opacity="0.5" />

      <!-- Pillar 3: Partnership -->
      <rect x="420" y="200" width="80" height="250" stroke-width="2" />
      <line x1="420" y1="240" x2="500" y2="240" stroke-width="0.5" opacity="0.5" />
      <line x1="420" y1="290" x2="500" y2="290" stroke-width="0.5" opacity="0.5" />
      <line x1="420" y1="340" x2="500" y2="340" stroke-width="0.5" opacity="0.5" />
      <line x1="420" y1="390" x2="500" y2="390" stroke-width="0.5" opacity="0.5" />

      <!-- Pillar 4: Results -->
      <rect x="540" y="250" width="80" height="200" stroke-width="2" />
      <line x1="540" y1="280" x2="620" y2="280" stroke-width="0.5" opacity="0.5" />
      <line x1="540" y1="320" x2="620" y2="320" stroke-width="0.5" opacity="0.5" />
      <line x1="540" y1="360" x2="620" y2="360" stroke-width="0.5" opacity="0.5" />
      <line x1="540" y1="400" x2="620" y2="400" stroke-width="0.5" opacity="0.5" />
    </g>

    <!-- Capital elements -->
    <g fill="none" stroke="#b8956e" stroke-width="1.5">
      <path d="M 175 250 L 220 210 L 265 250" />
      <path d="M 295 200 L 340 160 L 385 200" />
      <path d="M 415 200 L 460 160 L 505 200" />
      <path d="M 535 250 L 580 210 L 625 250" />
    </g>

    <!-- Connecting beams -->
    <line x1="180" y1="230" x2="620" y2="230" stroke="#c9a97d" stroke-width="1" opacity="0.4" />

    <!-- Decorative corner elements -->
    <g opacity="0.6">
      <path d="M 160 160 L 160 180 L 180 180" fill="none" stroke="#b8956e" stroke-width="2" />
      <path d="M 640 160 L 640 180 L 620 180" fill="none" stroke="#b8956e" stroke-width="2" />
    </g>
  </g>

  <!-- Abstract rays suggesting enlightenment/guidance -->
  <g opacity="0.1">
    <line x1="400" y1="100" x2="220" y2="160" stroke="#b8956e" stroke-width="1" />
    <line x1="400" y1="100" x2="580" y2="160" stroke="#b8956e" stroke-width="1" />
    <line x1="400" y1="80" x2="400" y2="160" stroke="#b8956e" stroke-width="2" />
  </g>
</svg>