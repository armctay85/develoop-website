<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <linearGradient id="criticalGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#111111;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0a0a0a;stop-opacity:1" />
    </linearGradient>
  </defs>

  <rect width="800" height="600" fill="url(#criticalGrad)" />

  <!-- Critical Path: Flow/Timeline concept -->
  <g opacity="0.5">
    <!-- Main path line -->
    <path d="M 100 300 Q 250 200, 400 300 T 700 300" 
          fill="none" stroke="#b8956e" stroke-width="3" />

    <!-- Milestone points -->
    <circle cx="100" cy="300" r="12" fill="none" stroke="#b8956e" stroke-width="2" />
    <circle cx="100" cy="300" r="5" fill="#b8956e" />
    
    <circle cx="250" cy="250" r="12" fill="none" stroke="#b8956e" stroke-width="2" />
    <circle cx="250" cy="250" r="5" fill="#b8956e" />
    
    <circle cx="400" cy="300" r="12" fill="none" stroke="#b8956e" stroke-width="2" />
    <circle cx="400" cy="300" r="5" fill="#b8956e" />
    
    <circle cx="550" cy="300" r="12" fill="none" stroke="#b8956e" stroke-width="2" />
    <circle cx="550" cy="300" r="5" fill="#b8956e" />
    
    <circle cx="700" cy="300" r="12" fill="none" stroke="#b8956e" stroke-width="2" />
    <circle cx="700" cy="300" r="5" fill="#b8956e" />

    <!-- Branch paths -->
    <path d="M 250 250 Q 300 150, 350 180" 
          fill="none" stroke="#c9a97d" stroke-width="1.5" stroke-dasharray="8,4" opacity="0.6" />
    <path d="M 400 300 Q 450 400, 500 420" 
          fill="none" stroke="#c9a97d" stroke-width="1.5" stroke-dasharray="8,4" opacity="0.6" />

    <!-- Timeline markers -->
    <line x1="100" y1="350" x2="100" y2="380" stroke="#b8956e" stroke-width="1" opacity="0.4" />
    <line x1="250" y1="300" x2="250" y2="380" stroke="#b8956e" stroke-width="1" opacity="0.4" />
    <line x1="400" y1="350" x2="400" y2="380" stroke="#b8956e" stroke-width="1" opacity="0.4" />
    <line x1="550" y1="350" x2="550" y2="380" stroke="#b8956e" stroke-width="1" opacity="0.4" />
    <line x1="700" y1="350" x2="700" y2="380" stroke="#b8956e" stroke-width="1" opacity="0.4" />

    <line x1="100" y1="380" x2="700" y2="380" stroke="#b8956e" stroke-width="0.5" opacity="0.3" />
  </g>

  <!-- Connection nodes -->
  <g opacity="0.3">
    <circle cx="350" cy="180" r="6" fill="#c9a97d" />
    <circle cx="500" cy="420" r="6" fill="#c9a97d" />
  </g>
</svg>