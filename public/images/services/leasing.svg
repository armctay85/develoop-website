<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <linearGradient id="leasingGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#111111;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0a0a0a;stop-opacity:1" />
    </linearGradient>
  </defs>

  <rect width="800" height="600" fill="url(#leasingGrad)" />

  <!-- Site Selection: Location/Map concept -->
  <g opacity="0.4">
    <!-- Abstract map grid -->
    <g stroke="#b8956e" stroke-width="0.5" opacity="0.3">
      <line x1="100" y1="100" x2="100" y2="500" />
      <line x1="200" y1="100" x2="200" y2="500" />
      <line x1="300" y1="100" x2="300" y2="500" />
      <line x1="400" y1="100" x2="400" y2="500" />
      <line x1="500" y1="100" x2="500" y2="500" />
      <line x1="600" y1="100" x2="600" y2="500" />
      <line x1="700" y1="100" x2="700" y2="500" />

      <line x1="100" y1="100" x2="700" y2="100" />
      <line x1="100" y1="200" x2="700" y2="200" />
      <line x1="100" y1="300" x2="700" y2="300" />
      <line x1="100" y1="400" x2="700" y2="400" />
      <line x1="100" y1="500" x2="700" y2="500" />
    </g>

    <!-- Primary location marker -->
    <g transform="translate(400, 250)">
      <path d="M 0 -40 C -25 -40, -40 -25, -40 0 C -40 30, 0 70, 0 70 C 0 70, 40 30, 40 0 C 40 -25, 25 -40, 0 -40 Z" 
            fill="none" stroke="#b8956e" stroke-width="2" />
      <circle cx="0" cy="0" r="12" fill="none" stroke="#b8956e" stroke-width="2" />
      <circle cx="0" cy="0" r="5" fill="#b8956e" />
    </g>

    <!-- Secondary markers -->
    <g opacity="0.4">
      <circle cx="250" cy="180" r="4" fill="#c9a97d" />
      <circle cx="550" cy="350" r="4" fill="#c9a97d" />
      <circle cx="300" cy="420" r="4" fill="#c9a97d" />
    </g>

    <!-- Radius circles -->
    <circle cx="400" cy="250" r="120" fill="none" stroke="#b8956e" stroke-width="0.5" stroke-dasharray="8,8" opacity="0.3" />
    <circle cx="400" cy="250" r="180" fill="none" stroke="#b8956e" stroke-width="0.5" stroke-dasharray="12,12" opacity="0.2" />
  </g>
</svg>