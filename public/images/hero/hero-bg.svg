<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <defs>
    <linearGradient id="heroGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0a0a;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#111111;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0a0a0a;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="heroGrad2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#b8956e;stop-opacity:0.05" />
      <stop offset="100%" style="stop-color:transparent;stop-opacity:0" />
    </linearGradient>
    <linearGradient id="heroGrad3" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#c9a97d;stop-opacity:0.03" />
      <stop offset="100%" style="stop-color:transparent;stop-opacity:0" />
    </linearGradient>
  </defs>

  <!-- Base background -->
  <rect width="1920" height="1080" fill="url(#heroGrad1)" />

  <!-- Architectural geometric composition -->
  <g opacity="0.4">
    <!-- Large vertical element - suggests building facade -->
    <rect x="1200" y="100" width="400" height="880" fill="none" stroke="#b8956e" stroke-width="1" opacity="0.2" />
    <rect x="1220" y="120" width="360" height="840" fill="none" stroke="#b8956e" stroke-width="0.5" opacity="0.1" />
    
    <!-- Horizontal divisions -->
    <line x1="1200" y1="300" x2="1600" y2="300" stroke="#b8956e" stroke-width="0.5" opacity="0.15" />
    <line x1="1200" y1="500" x2="1600" y2="500" stroke="#b8956e" stroke-width="0.5" opacity="0.15" />
    <line x1="1200" y1="700" x2="1600" y2="700" stroke="#b8956e" stroke-width="0.5" opacity="0.15" />
    <line x1="1200" y1="900" x2="1600" y2="900" stroke="#b8956e" stroke-width="0.5" opacity="0.15" />

    <!-- Vertical subdivisions -->
    <line x1="1333" y1="100" x2="1333" y2="980" stroke="#b8956e" stroke-width="0.5" opacity="0.1" />
    <line x1="1466" y1="100" x2="1466" y2="980" stroke="#b8956e" stroke-width="0.5" opacity="0.1" />
  </g>

  <!-- Secondary geometric element - abstract retail space -->
  <g opacity="0.3">
    <polygon points="200,800 500,600 800,800 800,1080 200,1080" fill="url(#heroGrad2)" />
    <line x1="200" y1="800" x2="200" y2="1080" stroke="#b8956e" stroke-width="1" opacity="0.3" />
    <line x1="500" y1="600" x2="500" y2="1080" stroke="#b8956e" stroke-width="0.5" opacity="0.2" />
    <line x1="800" y1="800" x2="800" y2="1080" stroke="#b8956e" stroke-width="1" opacity="0.3" />
  </g>

  <!-- Bronze accent elements -->
  <g opacity="0.6">
    <!-- Corner accent top right -->
    <path d="M 1700 150 L 1800 150 L 1800 250" fill="none" stroke="#b8956e" stroke-width="2" />
    <circle cx="1800" cy="150" r="4" fill="#b8956e" />

    <!-- Corner accent bottom left -->
    <path d="M 220 930 L 120 930 L 120 830" fill="none" stroke="#b8956e" stroke-width="2" />
    <circle cx="120" cy="930" r="4" fill="#b8956e" />
  </g>

  <!-- Abstract loop element - development cycle -->
  <g opacity="0.15">
    <path d="M 1400 200 C 1550 200, 1650 350, 1650 500 C 1650 650, 1550 800, 1400 800" 
          fill="none" stroke="#b8956e" stroke-width="3" stroke-linecap="round" />
    <path d="M 1350 250 C 1480 250, 1570 370, 1570 500 C 1570 630, 1480 750, 1350 750" 
          fill="none" stroke="#c9a97d" stroke-width="2" stroke-linecap="round" />
  </g>

  <!-- Subtle grid overlay -->
  <pattern id="heroGrid" x="0" y="0" width="80" height="80" patternUnits="userSpaceOnUse">
    <path d="M 80 0 L 0 0 0 80" fill="none" stroke="#b8956e" stroke-width="0.3" opacity="0.1" />
  </pattern>
  <rect width="1920" height="1080" fill="url(#heroGrid)" />

  <!-- Gradient overlays for depth -->
  <rect x="0" y="0" width="600" height="1080" fill="url(#heroGrad2)" opacity="0.5" />
  <rect x="1320" y="0" width="600" height="1080" fill="url(#heroGrad3)" opacity="0.3" />
</svg>