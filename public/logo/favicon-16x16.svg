<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" width="16" height="16">
  <!-- 16x16 Favicon with Loop Concept -->
  <rect width="16" height="16" rx="2" fill="#0a0a0a"/>
  
  <!-- Simplified Loop -->
  <path d="M 3 8 
           C 3 5, 5 3, 7 4
           C 9 5, 8 7, 6 8
           C 4 9, 3 7, 5 6
           C 6 4, 9 6, 10 8
           C 11 10, 8 12, 5 12
