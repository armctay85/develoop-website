<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 180" width="180" height="180">
  <!-- Apple Touch Icon with Loop Concept -->
  <rect width="180" height="180" rx="36" fill="#0a0a0a"/>
  
  <!-- The Loop -->
  <path d="M 45 90 
           C 45 55, 70 35, 95 45
           C 115 53, 105 75, 80 85
           C 62 92, 50 78, 65 65
           C 75 55, 100 60, 115 80
           C 130 105, 100 135, 65 135
           C 40 135, 30 115, 45 90 Z" 
        fill="none" 
        stroke="#b8956e" 
        stroke-width="6" 
        stroke-linecap="round" 
        stroke-linejoin="round"/>
  
  <!-- Corner accents -->
  <path d="M 25 50 L 25 25 L 50 25" fill="none" stroke="#b8956e" stroke-width="4" stroke-linecap="round"/>
  <path d="M 155 25 L 155 50" fill="none" stroke="#b8956e" stroke-width="4" stroke-linecap="round"/>
  <path d="M 155 130 L 155 155 L 130 155" fill="none" stroke="#b8956e" stroke-width="4" stroke-linecap="round"/>
  <path d="M 25 155 L 25 130" fill="none" stroke="#b8956e" stroke-width="4" stroke-linecap="round"/>
  
  <!-- Flow indicators -->
  <path d="M 75 40 L 85 45 L 80 55" fill="none" stroke="#c9a97d" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M 125 110 L 115 115 L 120 125" fill="none" stroke="#c9a97d" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
</svg>