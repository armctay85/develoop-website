<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!-- 32x32 Favicon with Loop Concept -->
  <rect width="32" height="32" rx="4" fill="#0a0a0a"/>
  
  <!-- The Loop -->
  <path d="M 6 16 
           C 6 10, 10 6, 14 8
           C 17 10, 15 14, 11 16
           C 8 17, 6 14, 9 11
           C 11 9, 15 10, 17 13
           C 19 17, 15 22, 10 22
           C 6 22, 4 18, 6 16 Z" 
        fill="none" 
        stroke="#b8956e" 
        stroke-width="2" 
        stroke-linecap="round" 
        stroke-linejoin="round"/>
  
  <!-- Corner accents -->
  <path d="M 4 8 L 4 4 L 8 4" fill="none" stroke="#b8956e" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M 28 4 L 28 8" fill="none" stroke="#b8956e" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M 28 24 L 28 28 L 24 28" fill="none" stroke="#b8956e" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M 4 28 L 4 24" fill="none" stroke="#b8956e" stroke-width="1.5" stroke-linecap="round"/>
</svg>