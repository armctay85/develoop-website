<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <linearGradient id="experienceGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#111111;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0a0a0a;stop-opacity:1" />
    </linearGradient>
  </defs>

  <rect width="800" height="600" fill="url(#experienceGrad)" />

  <!-- Experience: Timeline/Progression concept -->
  <g opacity="0.4">
    <!-- Central timeline -->
    <line x1="150" y1="300" x2="650" y2="300" stroke="#b8956e" stroke-width="2" />

    <!-- Milestone markers -->
    <g fill="none" stroke="#b8956e">
      <!-- 25 years span -->
      <circle cx="200" cy="300" r="20" stroke-width="2" />
      <circle cx="200" cy="300" r="10" fill="#b8956e" />
      <text x="200" y="340" text-anchor="middle" fill="#b8956e" font-size="10" font-family="serif">'00s</text>

      <circle cx="320" cy="300" r="20" stroke-width="2" />
      <circle cx="320" cy="300" r="10" fill="#b8956e" />
      <text x="320" y="340" text-anchor="middle" fill="#b8956e" font-size="10" font-family="serif">'05s</text>

      <circle cx="440" cy="300" r="20" stroke-width="2" />
      <circle cx="440" cy="300" r="10" fill="#b8956e" />
      <text x="440" y="340" text-anchor="middle" fill="#b8956e" font-size="10" font-family="serif">'10s</text>

      <circle cx="560" cy="300" r="20" stroke-width="2" />
      <circle cx="560" cy="300" r="10" fill="#b8956e" />
      <text x="560" y="340" text-anchor="middle" fill="#b8956e" font-size="10" font-family="serif">'15s</text>

      <circle cx="620" cy="300" r="15" stroke-width="2" />
      <circle cx="620" cy="300" r="8" fill="#c9a97d" />
      <text x="620" y="340" text-anchor="middle" fill="#c9a97d" font-size="10" font-family="serif">Now</text>
    </g>

    <!-- Brand bars above timeline -->
    <g fill="none" stroke="#b8956e" stroke-width="1">
      <!-- Kmart era -->
      <rect x="170" y="180" width="100" height="80" opacity="0.3" />
      <line x1="170" y1="220" x2="270" y2="220" stroke-width="0.5" opacity="0.5" />
      <line x1="170" y1="200" x2="270" y2="200" stroke-width="0.5" opacity="0.5" />
      <line x1="170" y1="240" x2="270" y2="240" stroke-width="0.5" opacity="0.5" />

      <!-- H&M era -->
      <rect x="290" y="160" width="100" height="100" opacity="0.3" />
      <line x1="290" y1="200" x2="390" y2="200" stroke-width="0.5" opacity="0.5" />
      <line x1="290" y1="220" x2="390" y2="220" stroke-width="0.5" opacity="0.5" />
      <line x1="290" y1="240" x2="390" y2="240" stroke-width="0.5" opacity="0.5" />

      <!-- Starbucks era -->
      <rect x="410" y="140" width="100" height="120" opacity="0.3" />
      <line x1="410" y1="180" x2="510" y2="180" stroke-width="0.5" opacity="0.5" />
      <line x1="410" y1="200" x2="510" y2="200" stroke-width="0.5" opacity="0.5" />
      <line x1="410" y1="220" x2="510" y2="220" stroke-width="0.5" opacity="0.5" />

      <!-- UNIQLO era -->
      <rect x="530" y="120" width="100" height="140" opacity="0.3" />
      <line x1="530" y1="160" x2="630" y2="160" stroke-width="0.5" opacity="0.5" />
      <line x1="530" y1="180" x2="630" y2="180" stroke-width="0.5" opacity="0.5" />
      <line x1="530" y1="200" x2="630" y2="200" stroke-width="0.5" opacity="0.5" />
    </g>

    <!-- Achievement markers below -->
    <g fill="#c9a97d" opacity="0.5">
      <circle cx="200" cy="380" r="3" />
      <circle cx="320" cy="400" r="3" />
      <circle cx="440" cy="420" r="3" />
      <circle cx="560" cy="440" r="3" />
    </g>

    <!-- Connecting lines for achievements -->
    <g stroke="#c9a97d" stroke-width="0.5" opacity="0.3">
      <line x1="200" y1="320" x2="200" y2="380" />
      <line x1="320" y1="320" x2="320" y2="400" />
      <line x1="440" y1="320" x2="440" y2="420" />
      <line x1="560" y1="320" x2="560" y2="440" />
    </g>
  </g>

  <!-- 25 Years badge -->
  <g transform="translate(680, 100)" opacity="0.4">
    <circle cx="0" cy="0" r="50" fill="none" stroke="#b8956e" stroke-width="1" />
    <circle cx="0" cy="0" r="45" fill="none" stroke="#b8956e" stroke-width="0.5" stroke-dasharray="4,4" />
    <line x1="-35" y1="0" x2="35" y2="0" stroke="#b8956e" stroke-width="0.5" />
    <line x1="0" y1="-35" x2="0" y2="35" stroke="#b8956e" stroke-width="0.5" />
  </g>
</svg>