<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <linearGradient id="lifecycleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#111111;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0a0a0a;stop-opacity:1" />
    </linearGradient>
  </defs>

  <rect width="800" height="600" fill="url(#lifecycleGrad)" />

  <!-- Lifecycle: Circular/Rotation concept -->
  <g opacity="0.5" transform="translate(400, 300)">
    <!-- Outer ring -->
    <circle cx="0" cy="0" r="180" fill="none" stroke="#b8956e" stroke-width="1.5" />

    <!-- Middle ring -->
    <circle cx="0" cy="0" r="120" fill="none" stroke="#b8956e" stroke-width="1" opacity="0.7" />

    <!-- Inner ring -->
    <circle cx="0" cy="0" r="60" fill="none" stroke="#b8956e" stroke-width="2" />

    <!-- Center point -->
    <circle cx="0" cy="0" r="15" fill="#b8956e" opacity="0.6" />

    <!-- Stage markers on outer ring -->
    <g stroke="#b8956e" stroke-width="2">
      <!-- Top -->
      <line x1="0" y1="-180" x2="0" y2="-200" />
      <circle cx="0" cy="-180" r="8" fill="none" />
      <circle cx="0" cy="-180" r="4" fill="#b8956e" />

      <!-- Right -->
      <line x1="180" y1="0" x2="200" y2="0" />
      <circle cx="180" cy="0" r="8" fill="none" />
      <circle cx="180" cy="0" r="4" fill="#b8956e" />

      <!-- Bottom -->
      <line x1="0" y1="180" x2="0" y2="200" />
      <circle cx="0" cy="180" r="8" fill="none" />
      <circle cx="0" cy="180" r="4" fill="#b8956e" />

      <!-- Left -->
      <line x1="-180" y1="0" x2="-200" y2="0" />
      <circle cx="-180" cy="0" r="8" fill="none" />
      <circle cx="-180" cy="0" r="4" fill="#b8956e" />
    </g>

    <!-- Curved arrows suggesting rotation -->
    <path d="M 90 -155 Q 130 -130, 155 -90" 
          fill="none" stroke="#c9a97d" stroke-width="2" stroke-linecap="round" opacity="0.5" />
    <polygon points="155,-90 165,-105 148,-100" fill="#c9a97d" opacity="0.5" />

    <path d="M 155 90 Q 130 130, 90 155" 
          fill="none" stroke="#c9a97d" stroke-width="2" stroke-linecap="round" opacity="0.5" />
    <polygon points="90,155 105,165 100,148" fill="#c9a97d" opacity="0.5" />

    <path d="M -90 155 Q -130 130, -155 90" 
          fill="none" stroke="#c9a97d" stroke-width="2" stroke-linecap="round" opacity="0.5" />
    <polygon points="-155,90 -165,105 -148,100" fill="#c9a97d" opacity="0.5" />

    <path d="M -155 -90 Q -130 -130, -90 -155" 
          fill="none" stroke="#c9a97d" stroke-width="2" stroke-linecap="round" opacity="0.5" />
    <polygon points="-90,-155 -105,-165 -100,-148" fill="#c9a97d" opacity="0.5" />
  </g>

  <!-- Connecting lines from center to corners -->
  <g opacity="0.2" stroke="#b8956e" stroke-width="0.5">
    <line x1="100" y1="100" x2="200" y2="200" />
    <line x1="700" y1="100" x2="600" y2="200" />
    <line x1="100" y1="500" x2="200" y2="400" />
    <line x1="700" y1="500" x2="600" y2="400" />
  </g>
</svg>