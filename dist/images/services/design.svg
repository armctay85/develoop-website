<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <linearGradient id="designGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#111111;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0a0a0a;stop-opacity:1" />
    </linearGradient>
  </defs>

  <rect width="800" height="600" fill="url(#designGrad)" />

  <!-- Design Management: Blueprint/Architecture concept -->
  <g opacity="0.4">
    <!-- Floor plan outline -->
    <rect x="200" y="100" width="400" height="400" fill="none" stroke="#b8956e" stroke-width="2" />

    <!-- Interior walls -->
    <line x1="200" y1="250" x2="450" y2="250" stroke="#b8956e" stroke-width="1" />
    <line x1="450" y1="100" x2="450" y2="250" stroke="#b8956e" stroke-width="1" />
    <line x1="325" y1="250" x2="325" y2="500" stroke="#b8956e" stroke-width="1" />
    <line x1="325" y1="375" x2="600" y2="375" stroke="#b8956e" stroke-width="1" />

    <!-- Door openings -->
    <!-- Top section doors -->
    <path d="M 280 250 Q 280 220 310 220" fill="none" stroke="#c9a97d" stroke-width="1" />
    <line x1="310" y1="220" x2="310" y2="250" stroke="#c9a97d" stroke-width="1" />

    <!-- Bottom section doors -->
    <path d="M 450 320 Q 480 320 480 350" fill="none" stroke="#c9a97d" stroke-width="1" />
    <line x1="450" y1="320" x2="450" y2="350" stroke="#c9a97d" stroke-width="1" />

    <!-- Windows -->
    <line x1="200" y1="150" x2="200" y2="200" stroke="#c9a97d" stroke-width="2" />
    <line x1="200" y1="300" x2="200" y2="350" stroke="#c9a97d" stroke-width="2" />
    <line x1="200" y1="425" x2="200" y2="475" stroke="#c9a97d" stroke-width="2" />

    <line x1="325" y1="100" x2="375" y2="100" stroke="#c9a97d" stroke-width="2" />
    <line x1="500" y1="100" x2="550" y2="100" stroke="#c9a97d" stroke-width="2" />

    <!-- Dimensions -->
    <line x1="180" y1="100" x2="180" y2="500" stroke="#b8956e" stroke-width="0.5" stroke-dasharray="4,4" opacity="0.5" />
    <line x1="170" y1="100" x2="190" y2="100" stroke="#b8956e" stroke-width="0.5" />
    <line x1="170" y1="500" x2="190" y2="500" stroke="#b8956e" stroke-width="0.5" />
  </g>

  <!-- Architectural markers -->
  <g opacity="0.5">
    <circle cx="150" cy="150" r="3" fill="#b8956e" />
    <circle cx="650" cy="200" r="3" fill="#b8956e" />
    <circle cx="150" cy="450" r="3" fill="#b8956e" />
    <circle cx="650" cy="400" r="3" fill="#b8956e" />
  </g>
</svg>