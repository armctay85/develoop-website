<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <linearGradient id="optimizationGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#111111;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0a0a0a;stop-opacity:1" />
    </linearGradient>
  </defs>

  <rect width="800" height="600" fill="url(#optimizationGrad)" />

  <!-- Optimization: Chart/Metrics concept -->
  <g opacity="0.5">
    <!-- Grid lines -->
    <g stroke="#b8956e" stroke-width="0.5" opacity="0.3">
      <line x1="150" y1="450" x2="650" y2="450" />
      <line x1="150" y1="375" x2="650" y2="375" />
      <line x1="150" y1="300" x2="650" y2="300" />
      <line x1="150" y1="225" x2="650" y2="225" />
      <line x1="150" y1="150" x2="650" y2="150" />

      <line x1="150" y1="450" x2="150" y2="150" />
      <line x1="250" y1="450" x2="250" y2="150" />
      <line x1="350" y1="450" x2="350" y2="150" />
      <line x1="450" y1="450" x2="450" y2="150" />
      <line x1="550" y1="450" x2="550" y2="150" />
      <line x1="650" y1="450" x2="650" y2="150" />
    </g>

    <!-- Ascending line chart -->
    <polyline 
      points="150,400 250,380 350,320 450,280 550,200 650,180" 
      fill="none" 
      stroke="#b8956e" 
      stroke-width="3" 
      stroke-linecap="round" 
      stroke-linejoin="round" />

    <!-- Data points -->
    <g fill="#b8956e">
      <circle cx="150" cy="400" r="5" />
      <circle cx="250" cy="380" r="5" />
      <circle cx="350" cy="320" r="5" />
      <circle cx="450" cy="280" r="5" />
      <circle cx="550" cy="200" r="5" />
      <circle cx="650" cy="180" r="5" />
    </g>

    <!-- Area under curve -->
    <polygon 
      points="150,450 150,400 250,380 350,320 450,280 550,200 650,180 650,450" 
      fill="#b8956e" 
      opacity="0.1" />

    <!-- Benchmark line -->
    <line x1="150" y1="300" x2="650" y2="300" 
          stroke="#c9a97d" 
          stroke-width="1" 
          stroke-dasharray="8,8" 
          opacity="0.5" />

    <!-- Performance indicators -->
    <g opacity="0.6">
      <!-- Up arrows -->
      <g transform="translate(680, 190)">
        <path d="M 0 0 L 8 -12 L 16 0" fill="none" stroke="#b8956e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
        <line x1="8" y1="0" x2="8" y2="20" stroke="#b8956e" stroke-width="2" />
      </g>

      <g transform="translate(680, 250)">
        <path d="M 0 0 L 8 -12 L 16 0" fill="none" stroke="#b8956e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
        <line x1="8" y1="0" x2="8" y2="15" stroke="#b8956e" stroke-width="2" />
      </g>
    </g>

    <!-- Axis labels -->
    <g opacity="0.4" fill="#b8956e">
      <rect x="120" y="195" width="15" height="2" />
      <rect x="120" y="295" width="15" height="2" />
      <rect x="120" y="395" width="15" height="2" />
    </g>
  </g>
</svg>