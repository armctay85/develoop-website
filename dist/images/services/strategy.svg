<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <linearGradient id="strategyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#111111;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0a0a0a;stop-opacity:1" />
    </linearGradient>
  </defs>

  <rect width="800" height="600" fill="url(#strategyGrad)" />

  <!-- Strategy: Target/Focus concept -->
  <g opacity="0.4">
    <!-- Concentric circles suggesting target/focus -->
    <circle cx="400" cy="300" r="150" fill="none" stroke="#b8956e" stroke-width="1" opacity="0.3" />
    <circle cx="400" cy="300" r="100" fill="none" stroke="#b8956e" stroke-width="1.5" opacity="0.4" />
    <circle cx="400" cy="300" r="50" fill="none" stroke="#b8956e" stroke-width="2" opacity="0.5" />
    <circle cx="400" cy="300" r="15" fill="#b8956e" opacity="0.6" />

    <!-- Crosshairs -->
    <line x1="400" y1="120" x2="400" y2="250" stroke="#b8956e" stroke-width="1" opacity="0.3" />
    <line x1="400" y1="350" x2="400" y2="480" stroke="#b8956e" stroke-width="1" opacity="0.3" />
    <line x1="220" y1="300" x2="350" y2="300" stroke="#b8956e" stroke-width="1" opacity="0.3" />
    <line x1="450" y1="300" x2="580" y2="300" stroke="#b8956e" stroke-width="1" opacity="0.3" />

    <!-- Corner markers -->
    <path d="M 280 180 L 280 220 L 320 220" fill="none" stroke="#b8956e" stroke-width="2" />
    <path d="M 520 180 L 520 220 L 480 220" fill="none" stroke="#b8956e" stroke-width="2" />
    <path d="M 280 420 L 280 380 L 320 380" fill="none" stroke="#b8956e" stroke-width="2" />
    <path d="M 520 420 L 520 380 L 480 380" fill="none" stroke="#b8956e" stroke-width="2" />
  </g>

  <!-- Data points suggesting strategic planning -->
  <g opacity="0.5">
    <circle cx="200" cy="150" r="3" fill="#c9a97d" />
    <circle cx="600" cy="200" r="3" fill="#c9a97d" />
    <circle cx="650" cy="400" r="3" fill="#c9a97d" />
    <circle cx="150" cy="450" r="3" fill="#c9a97d" />
    
    <line x1="200" y1="150" x2="600" y2="200" stroke="#c9a97d" stroke-width="0.5" opacity="0.3" />
    <line x1="600" y1="200" x2="650" y2="400" stroke="#c9a97d" stroke-width="0.5" opacity="0.3" />
    <line x1="650" y1="400" x2="150" y2="450" stroke="#c9a97d" stroke-width="0.5" opacity="0.3" />
  </g>
</svg>